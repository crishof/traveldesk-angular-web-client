name: CI

# Verificacion del frontend Angular en cada push a develop/main y en PRs a main.
# El despliegue lo gestiona Vercel via su integracion git al pushear a main
# (no se dispara desde aqui; no requiere secrets en el repo).
on:
  push:
    branches: [develop, main]
    paths:
      - 'traveldesk-web-client/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'traveldesk-web-client/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traveldesk-web-client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: traveldesk-web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build:prod
